<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>8. 任务运行中</title>
    <style>
        :root {
          --navy:#10213c;
          --muted:#71829a;
          --pink:#ff3478;
          --pink2:#ff4e86;
          --green:#12b96b;
          --blue:#2f7df5;
          --line:#e7edf3;
          --surface:#ffffff;
        }
        *{box-sizing:border-box}
        html,body{
          margin:0;
          min-height:100%;
          background:#f8fbff;
          font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color:var(--navy);
        }
        body{display:flex;justify-content:center;align-items:flex-start}
        .canvas{
          position:relative;
          width:941px;
          height:1672px;
          overflow:hidden;
          background:
            radial-gradient(ellipse at 50% 30%,rgba(220,232,245,.55),rgba(248,251,255,0) 48%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 100%);
        }
        .page-title{
          position:absolute;
          top:35px;
          left:0;
          width:100%;
          text-align:center;
          font-size:49px;
          line-height:1;
          font-weight:900;
          color:#10213d;
          letter-spacing:.4px;
        }
        .phone{
          position:absolute;
          left:143px;
          top:117px;
          width:648px;
          height:1493px;
          border-radius:59px;
          background:linear-gradient(135deg,#e0e6eb 0%,#89929c 4%,#58616b 7%,#f1f4f7 13%,#d5dbe1 92%,#eef2f5 100%);
          box-shadow:0 16px 36px rgba(28,45,67,.18),0 2px 6px rgba(0,0,0,.10);
        }
        .screen{
          position:absolute;
          inset:16px;
          border-radius:47px;
          overflow:hidden;
          background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
          box-shadow:inset 0 0 0 1px rgba(18,32,55,.05);
        }
        .statusbar{
          height:72px;
          padding:23px 57px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:21px;
          font-weight:900;
          color:#111;
        }
        .status-icons{display:flex;align-items:center;gap:9px}
        .signal{height:18px;display:flex;align-items:flex-end;gap:2px}
        .signal i{display:block;width:4px;background:#080808;border-radius:2px}
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi{width:23px;height:17px;position:relative}
        .wifi::before{content:"";position:absolute;left:1px;right:1px;top:0;height:12px;border-top:5px solid #080808;border-radius:50%}
        .wifi::after{content:"";position:absolute;left:8px;top:9px;width:7px;height:7px;border-radius:50%;background:#080808}
        .battery{width:20px;height:20px;border-radius:3px;background:#080808;position:relative}
        .battery::after{content:"";position:absolute;right:-4px;top:5px;width:3px;height:8px;background:#080808;border-radius:0 2px 2px 0}

        .header{
          height:111px;
          display:flex;
          align-items:center;
          padding:7px 35px;
        }
        .back{
          width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:18px;
        }
        .back::before{
          content:"";width:17px;height:17px;border-left:4px solid #10213c;border-bottom:4px solid #10213c;
          transform:rotate(45deg);margin-left:8px;
        }
        .header-title{font-size:35px;font-weight:900}
        .more-head{
          margin-left:auto;
          width:42px;height:42px;
          display:flex;align-items:center;justify-content:center;gap:5px;
        }
        .more-head i{display:block;width:5px;height:5px;border-radius:50%;background:#10213c}

        .content{
          position:absolute;
          left:37px;right:37px;
          top:184px;
          bottom:104px;
        }
        .card{
          background:#fff;
          border:1px solid #edf1f5;
          border-radius:18px;
          box-shadow:0 7px 22px rgba(33,61,96,.05);
        }
        .current-task{
          height:265px;
          padding:24px 25px;
        }
        .card-title{
          font-size:27px;
          font-weight:900;
          line-height:1;
          margin-bottom:21px;
        }
        .task-user{
          display:flex;
          align-items:center;
        }
        .avatar{
          width:82px;height:82px;flex:0 0 82px;
          border-radius:50%;
          overflow:hidden;
          background:#edf4fa;
        }
        .avatar img{width:100%;height:100%;object-fit:cover;display:block}
        .task-user-info{margin-left:19px}
        .task-user-name{font-size:27px;font-weight:900}
        .task-user-uid{margin-top:8px;font-size:22px;color:#72839a}
        .progress-head{
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-top:22px;
        }
        .progress-label{font-size:25px;font-weight:900}
        .progress-value{font-size:23px;color:#536882}
        .progress-row{display:flex;align-items:center;gap:14px;margin-top:10px}
        .track{
          flex:1;height:18px;border-radius:10px;background:#e9eef4;overflow:hidden;
        }
        .fill{width:8%;height:100%;border-radius:10px;background:linear-gradient(90deg,#ff3478,#ff4e86)}
        .percent{width:57px;text-align:right;font-size:22px;color:#536882}

        .video-card{
          height:217px;
          margin-top:17px;
          padding:22px 24px;
        }
        .video-body{
          display:flex;
          align-items:center;
          margin-top:15px;
        }
        .thumb{
          width:202px;height:124px;flex:0 0 202px;
          border-radius:11px;
          overflow:hidden;
          background:#ddd;
        }
        .thumb img{width:100%;height:100%;object-fit:cover;display:block}
        .video-info{margin-left:19px;min-width:0}
        .video-title{
          font-size:24px;
          font-weight:900;
          line-height:1.28;
        }
        .video-meta{
          margin-top:7px;
          font-size:20px;
          color:#71829a;
          line-height:1.2;
        }

        .account-card{
          height:165px;
          margin-top:17px;
          padding:22px 24px;
        }
        .account-row{
          display:flex;
          align-items:center;
          margin-top:13px;
        }
        .account-name{font-size:25px;font-weight:900;margin-left:18px}
        .badge{
          margin-left:18px;
          padding:7px 13px;
          border-radius:9px;
          background:#e6faf0;
          color:#10ad61;
          font-size:20px;
          font-weight:900;
        }
        .switch-btn{
          margin-left:auto;
          height:59px;
          padding:0 20px;
          border:0;
          border-radius:11px;
          background:#eef3f8;
          color:#51647f;
          font-size:20px;
          font-weight:700;
        }

        .action-card{
          height:165px;
          margin-top:17px;
          padding:22px 24px;
        }
        .action-line{
          font-size:22px;
          color:#51647f;
          margin-top:13px;
        }
        .action-count{
          margin-top:12px;
          display:flex;
          justify-content:space-between;
          font-size:21px;
          color:#51647f;
        }

        .stats-card{
          height:183px;
          margin-top:17px;
          padding:22px 24px;
        }
        .stats{
          display:grid;
          grid-template-columns:repeat(3,1fr);
          gap:12px;
          margin-top:16px;
        }
        .metric{
          height:93px;
          border-radius:13px;
          text-align:center;
          padding-top:13px;
          background:#f2f7ff;
        }
        .metric:nth-child(2){background:#f5f8fb}
        .metric:nth-child(3){background:#fff0f3}
        .metric-label{font-size:20px}
        .metric-value{font-size:31px;font-weight:900;margin-top:8px;line-height:1}

        .actions{
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:20px;
          margin-top:18px;
        }
        .btn{
          height:81px;
          border-radius:13px;
          font-size:27px;
          font-weight:900;
        }
        .pause{
          border:0;
          color:#fff;
          background:linear-gradient(90deg,#ff3478,#ff4a84);
        }
        .stop{
          border:2px solid #ff3478;
          color:#ff3478;
          background:#fff;
        }
        .pause::before{content:"Ⅱ";margin-right:16px;font-size:29px}
        .stop::before{
          content:"";
          display:inline-block;
          width:18px;height:18px;
          border:4px solid #ff3478;
          border-radius:4px;
          margin-right:18px;
          vertical-align:-2px;
        }

        .nav{
          position:absolute;
          left:0;right:0;bottom:0;
          height:104px;
          border-top:1px solid #e6ebf1;
          background:#fff;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:10px 31px 8px;
        }
        .nav-item{
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          color:#6d8098;
          font-size:20px;
        }
        .nav-item.active{color:var(--pink)}
        .nav-item svg{
          width:33px;height:33px;
          stroke:currentColor;
          fill:none;
          stroke-width:2.3;
          stroke-linecap:round;
          stroke-linejoin:round;
        }
        .nav-item.active .fill{fill:currentColor;stroke:currentColor}
    </style>
</head>
