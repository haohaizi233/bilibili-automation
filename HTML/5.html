<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>5. 目标UP管理</title>
    <style>
        :root {
          --navy:#10213c;
          --muted:#71829a;
          --pink:#ff3478;
          --pink2:#ff4e86;
          --line:#e8edf3;
          --surface:#fff;
        }
        *{box-sizing:border-box}
        html,body{
          margin:0;
          min-height:100%;
          background:#f8fbff;
          font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color:var(--navy);
        }
        body{display:flex;justify-content:center;align-items:flex-start}
        .canvas{
          position:relative;
          width:1086px;
          height:1448px;
          overflow:hidden;
          background:
            radial-gradient(ellipse at 50% 28%,rgba(220,232,245,.70),rgba(248,251,255,0) 49%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 54%,#f5f9fd 100%);
        }
        .page-title{
          position:absolute;
          top:39px;
          left:0;
          width:100%;
          text-align:center;
          font-size:49px;
          line-height:1;
          font-weight:900;
          color:#10213d;
          letter-spacing:.5px;
        }
        .phone{
          position:absolute;
          left:229px;
          top:126px;
          width:628px;
          height:1255px;
          border-radius:83px;
          background:linear-gradient(135deg,#e6ebef 0%,#9097a0 4%,#101319 8%,#020304 16%,#06080b 83%,#2a3037 92%,#d9dee3 98%);
          box-shadow:0 18px 38px rgba(22,40,63,.22),0 3px 7px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.45);
        }
        .phone::before{
          content:"";
          position:absolute;
          right:-7px;
          top:271px;
          width:8px;
          height:150px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .phone::after{
          content:"";
          position:absolute;
          right:-7px;
          top:451px;
          width:8px;
          height:84px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .screen{
          position:absolute;
          inset:16px;
          border-radius:66px;
          overflow:hidden;
          background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
          box-shadow:inset 0 0 0 1px rgba(18,32,55,.06);
        }
        .camera{
          position:absolute;
          z-index:20;
          top:19px;
          left:50%;
          transform:translateX(-50%);
          width:31px;
          height:31px;
          border-radius:50%;
          background:radial-gradient(circle at 53% 44%,#54708c 0 9%,#101922 12% 26%,#020305 29% 100%);
          box-shadow:0 0 0 3px rgba(9,16,24,.10);
        }
        .statusbar{
          height:62px;
          padding:18px 34px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:21px;
          font-weight:900;
          color:#111;
        }
        .status-icons{display:flex;align-items:center;gap:9px}
        .signal{height:18px;display:flex;align-items:flex-end;gap:2px}
        .signal i{display:block;width:4px;background:#080808;border-radius:2px}
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi{width:23px;height:17px;position:relative}
        .wifi::before{content:"";position:absolute;left:1px;right:1px;top:0;height:12px;border-top:5px solid #080808;border-radius:50%}
        .wifi::after{content:"";position:absolute;left:8px;top:9px;width:7px;height:7px;border-radius:50%;background:#080808}
        .battery{width:20px;height:20px;border-radius:3px;background:#080808;position:relative}
        .battery::after{content:"";position:absolute;right:-4px;top:5px;width:3px;height:8px;background:#080808;border-radius:0 2px 2px 0}

        .header{
          height:105px;
          display:flex;
          align-items:center;
          padding:8px 31px;
        }
        .back{
          width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:16px;
        }
        .back::before{
          content:"";width:17px;height:17px;border-left:4px solid #0f203a;border-bottom:4px solid #0f203a;
          transform:rotate(45deg);margin-left:8px;
        }
        .header-title{font-size:34px;font-weight:900;letter-spacing:.3px}
        .add-btn{
          margin-left:auto;
          height:64px;
          padding:0 26px;
          border:0;
          border-radius:13px;
          background:linear-gradient(120deg,#ff3478,#ff4e86);
          color:#fff;
          font-size:25px;
          font-weight:700;
          box-shadow:0 8px 18px rgba(255,50,119,.14);
        }
        .add-btn .plus{font-size:36px;font-weight:300;vertical-align:-2px;margin-right:4px}

        .tabs{
          height:82px;
          display:grid;
          grid-template-columns:1fr 1fr;
          align-items:end;
          padding:0 27px;
          border-bottom:1px solid #edf1f5;
        }
        .tab{
          height:82px;
          position:relative;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:25px;
          font-weight:700;
          color:#74849b;
        }
        .tab.active{color:#111b2d;font-weight:900}
        .tab.active::after{
          content:"";
          position:absolute;
          left:0;right:0;bottom:-1px;
          height:5px;
          border-radius:5px;
          background:var(--pink);
        }

        .body{
          position:absolute;
          left:27px;right:27px;
          top:249px;
          bottom:91px;
          padding-top:22px;
        }
        .search{
          height:72px;
          border-radius:13px;
          background:#f1f5f9;
          display:flex;
          align-items:center;
          padding:0 22px;
          color:#7d8ca1;
          font-size:23px;
        }
        .search-icon{
          width:29px;height:29px;border:3px solid #2d405d;border-radius:50%;
          position:relative;margin-right:18px;flex:0 0 29px;
        }
        .search-icon::after{
          content:"";
          position:absolute;
          width:13px;height:3px;
          background:#2d405d;
          right:-9px;bottom:-4px;
          transform:rotate(45deg);
          border-radius:3px;
        }

        .target-card{
          height:150px;
          margin-top:22px;
          background:#fff;
          border:1px solid #e9eef4;
          border-radius:18px;
          box-shadow:0 7px 22px rgba(33,61,96,.05);
          display:flex;
          align-items:center;
          padding:19px 20px;
        }
        .avatar{
          width:103px;
          height:103px;
          flex:0 0 103px;
          border-radius:50%;
          overflow:hidden;
          background:#edf4fb;
        }
        .avatar img{width:100%;height:100%;object-fit:cover;display:block}
        .info{margin-left:24px;flex:1;min-width:0}
        .name-row{display:flex;align-items:center}
        .name{font-size:28px;font-weight:900;white-space:nowrap}
        .hot{
          margin-left:auto;
          padding:9px 14px;
          border-radius:10px;
          color:var(--pink);
          background:#ffe8f0;
          font-size:21px;
          line-height:1;
          font-weight:900;
        }
        .meta{
          margin-top:10px;
          color:#71829a;
          font-size:21px;
          line-height:1.1;
        }
        .more{
          width:31px;
          margin-left:10px;
          display:flex;
          flex-direction:column;
          align-items:center;
          gap:5px;
        }
        .more i{width:4px;height:4px;border-radius:50%;background:#10213c}

        .nav{
          position:absolute;
          left:0;right:0;bottom:0;
          height:91px;
          border-top:1px solid #e6ebf1;
          background:#fff;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:8px 18px 6px;
        }
        .nav-item{
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          color:#687b95;
          font-size:18px;
        }
        .nav-item.active{color:var(--pink)}
        .nav-item svg{
          width:31px;height:31px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round
        }
        .nav-item.active .fill{fill:currentColor;stroke:currentColor}
    </style>
</head>
