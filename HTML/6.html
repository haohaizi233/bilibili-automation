<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>6. 添加目标UP</title>
    <style>
        :root {
          --navy:#0f1e38;
          --muted:#71829b;
          --pink:#ff3478;
          --pink2:#ff4d86;
          --line:#e7ecf2;
        }
        *{box-sizing:border-box}
        html,body{
          margin:0;
          min-height:100%;
          background:#f8fbff;
          font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color:var(--navy);
        }
        body{display:flex;justify-content:center;align-items:flex-start}
        .canvas{
          position:relative;
          width:941px;
          height:1672px;
          overflow:hidden;
          background:
            radial-gradient(ellipse at 50% 32%,rgba(224,234,246,.58),rgba(249,252,255,0) 48%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 100%);
        }
        .page-title{
          position:absolute;
          top:38px;
          left:0;
          width:100%;
          text-align:center;
          font-size:47px;
          font-weight:900;
          letter-spacing:.5px;
          color:#10213d;
        }
        .phone{
          position:absolute;
          left:122px;
          top:146px;
          width:687px;
          height:1453px;
          border-radius:51px;
          background:linear-gradient(135deg,#eff2f5 0%,#d9dee4 50%,#f5f7f9 100%);
          box-shadow:0 14px 31px rgba(26,45,68,.13),0 2px 5px rgba(0,0,0,.08);
        }
        .screen{
          position:absolute;
          inset:9px;
          border-radius:43px;
          overflow:hidden;
          background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
          box-shadow:inset 0 0 0 1px rgba(18,32,55,.05);
        }
        .statusbar{
          height:70px;
          padding:23px 48px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:22px;
          font-weight:900;
          color:#111;
        }
        .status-icons{display:flex;align-items:center;gap:9px}
        .signal{height:18px;display:flex;align-items:flex-end;gap:2px}
        .signal i{display:block;width:4px;background:#080808;border-radius:2px}
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi{width:23px;height:17px;position:relative}
        .wifi::before{content:"";position:absolute;left:1px;right:1px;top:0;height:12px;border-top:5px solid #080808;border-radius:50%}
        .wifi::after{content:"";position:absolute;left:8px;top:9px;width:7px;height:7px;border-radius:50%;background:#080808}
        .battery{width:20px;height:20px;border-radius:3px;background:#080808;position:relative}
        .battery::after{content:"";position:absolute;right:-4px;top:5px;width:3px;height:8px;background:#080808;border-radius:0 2px 2px 0}

        .header{
          height:117px;
          display:flex;
          align-items:center;
          padding:8px 38px;
        }
        .back{
          width:43px;height:43px;display:flex;align-items:center;justify-content:center;margin-right:20px;
        }
        .back::before{
          content:"";width:18px;height:18px;border-left:4px solid #10213c;border-bottom:4px solid #10213c;
          transform:rotate(45deg);margin-left:8px;
        }
        .header-title{font-size:36px;font-weight:900}

        .tabs{
          height:110px;
          display:grid;
          grid-template-columns:1fr 1fr;
          align-items:end;
          padding:0 37px;
          border-bottom:1px solid #e6ebf1;
        }
        .tab{
          height:110px;
          display:flex;
          align-items:center;
          justify-content:center;
          position:relative;
          font-size:28px;
          font-weight:700;
          color:#7b899e;
        }
        .tab.active{color:#0f1f39;font-weight:900}
        .tab.active::after{
          content:"";position:absolute;left:0;right:0;bottom:-1px;height:5px;border-radius:5px;background:var(--pink);
        }

        .body{
          position:absolute;
          left:38px;right:38px;
          top:297px;
          bottom:102px;
        }
        .search-row{
          height:83px;
          display:grid;
          grid-template-columns:1fr 143px;
          gap:22px;
        }
        .searchbox{
          height:83px;border-radius:13px;background:#f0f4f8;
          display:flex;align-items:center;padding:0 28px;
          font-size:25px;font-weight:700;color:#75859d;
        }
        .search-icon{
          width:31px;height:31px;border:3px solid #2d405d;border-radius:50%;position:relative;margin-right:20px;flex:0 0 31px;
        }
        .search-icon::after{
          content:"";position:absolute;width:14px;height:3px;background:#2d405d;right:-10px;bottom:-4px;transform:rotate(45deg);border-radius:3px;
        }
        .search-btn{
          height:83px;border:0;border-radius:13px;
          background:linear-gradient(120deg,#ff3478,#ff4e86);
          color:#fff;font-size:28px;font-weight:800;
          box-shadow:0 8px 18px rgba(255,50,119,.14);
        }
        .results{margin-top:28px}
        .result-card{
          height:169px;
          margin-bottom:17px;
          background:#fff;
          border:1px solid #edf1f5;
          border-radius:18px;
          box-shadow:0 6px 18px rgba(36,63,95,.045);
          display:flex;align-items:center;
          padding:19px 21px;
        }
        .result-card.selected{
          background:linear-gradient(90deg,#fff3f6,#fff7f9);
          border-color:#fff0f4;
        }
        .avatar{
          width:118px;height:118px;flex:0 0 118px;border-radius:50%;overflow:hidden;background:#edf3f9;position:relative;
        }
        .avatar img{width:100%;height:100%;object-fit:cover;display:block}
        .small-ok{
          position:absolute;right:3px;bottom:3px;width:31px;height:31px;border-radius:50%;
          background:#10b767;border:3px solid white;color:#fff;display:flex;align-items:center;justify-content:center;
          font-size:18px;font-weight:900;
        }
        .info{margin-left:33px;flex:1;min-width:0}
        .name{font-size:29px;font-weight:900;line-height:1.1}
        .meta{margin-top:11px;color:#71829b;font-size:23px;line-height:1}
        .radio{
          width:51px;height:51px;flex:0 0 51px;border-radius:50%;border:3px solid #94a1b3;margin-left:12px;position:relative;
        }
        .radio.selected{
          border:none;background:linear-gradient(145deg,#ff2e72,#ff4e86);
          box-shadow:0 5px 12px rgba(255,47,115,.14);
        }
        .radio.selected::before{
          content:"";position:absolute;width:22px;height:12px;left:14px;top:14px;
          border-left:4px solid #fff;border-bottom:4px solid #fff;transform:rotate(-45deg);border-radius:2px;
        }
        .confirm{
          position:absolute;left:0;right:0;bottom:18px;height:94px;
          border:0;border-radius:13px;background:linear-gradient(90deg,#ff3277,#ff4380);
          color:#fff;font-size:31px;font-weight:900;
          box-shadow:0 8px 18px rgba(255,55,119,.12);
        }

        .nav{
          position:absolute;left:0;right:0;bottom:0;height:102px;
          border-top:1px solid #e6ebf1;background:#fff;
          display:grid;grid-template-columns:repeat(5,1fr);
          padding:10px 31px 7px;
        }
        .nav-item{
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
          color:#6d8098;font-size:20px;
        }
        .nav-item.active{color:var(--pink)}
        .nav-item svg{
          width:33px;height:33px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;
        }
        .nav-item.active .fill{fill:currentColor;stroke:currentColor}
        .home-indicator{
          position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
          width:190px;height:9px;border-radius:8px;background:#d1d5db;
        }
    </style>
</head>
