<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2. 账号管理</title>
    <style>
        :root {
          --navy: #10203a;
          --text: #10203a;
          --muted: #6f819c;
          --pink: #ff3277;
          --pink2: #ff4e86;
          --green: #13b86a;
          --orange: #ff7a16;
          --red: #ff315d;
          --surface: #ffffff;
          --line: #eaf0f5;
        }
        * { box-sizing: border-box; }
        html, body {
          margin: 0;
          min-height: 100%;
          background: #f8fbff;
          font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color: var(--text);
        }
        body {
          display: flex;
          justify-content: center;
          align-items: flex-start;
        }
        .canvas {
          position: relative;
          width: 1086px;
          height: 1448px;
          overflow: hidden;
          background:
            radial-gradient(ellipse at 50% 30%, rgba(220,232,245,.68), rgba(248,251,255,0) 48%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 54%,#f5f9fd 100%);
        }
        .page-title {
          position: absolute;
          top: 39px;
          left: 0;
          width: 100%;
          text-align: center;
          font-size: 51px;
          line-height: 1;
          font-weight: 900;
          letter-spacing: .5px;
          color: #10213d;
        }
        .phone {
          position: absolute;
          left: 229px;
          top: 126px;
          width: 628px;
          height: 1255px;
          border-radius: 83px;
          background:
            linear-gradient(135deg,#e6ebef 0%,#9097a0 4%,#101319 8%,#020304 16%,#06080b 83%,#2a3037 92%,#d9dee3 98%);
          box-shadow:
            0 18px 38px rgba(22,40,63,.22),
            0 3px 7px rgba(0,0,0,.18),
            inset 0 0 0 1px rgba(255,255,255,.45);
        }
        .phone::before {
          content:"";
          position:absolute;
          right:-7px;
          top:271px;
          width:8px;
          height:150px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .phone::after {
          content:"";
          position:absolute;
          right:-7px;
          top:451px;
          width:8px;
          height:84px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .screen {
          position:absolute;
          inset:16px;
          border-radius:66px;
          overflow:hidden;
          background:linear-gradient(180deg,#ffffff 0%,#fbfcfe 100%);
          box-shadow: inset 0 0 0 1px rgba(18,32,55,.06);
        }
        .camera {
          position:absolute;
          z-index:20;
          top:19px;
          left:50%;
          transform:translateX(-50%);
          width:31px;
          height:31px;
          border-radius:50%;
          background:
            radial-gradient(circle at 53% 44%,#54708c 0 9%,#101922 12% 26%,#020305 29% 100%);
          box-shadow:0 0 0 3px rgba(9,16,24,.10);
        }
        .statusbar {
          height: 62px;
          padding: 18px 34px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:21px;
          font-weight:900;
          color:#111;
        }
        .status-icons { display:flex; align-items:center; gap:9px; }
        .signal { height:18px; display:flex; align-items:flex-end; gap:2px; }
        .signal i { display:block; width:4px; background:#080808; border-radius:2px; }
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi { width:23px; height:17px; position:relative; }
        .wifi::before {
          content:""; position:absolute; left:1px; right:1px; top:0; height:12px;
          border-top:5px solid #080808; border-radius:50%;
        }
        .wifi::after {
          content:""; position:absolute; left:8px; top:9px; width:7px; height:7px;
          border-radius:50%; background:#080808;
        }
        .battery {
          width:20px; height:20px; border-radius:3px; background:#080808; position:relative;
        }
        .battery::after {
          content:""; position:absolute; right:-4px; top:5px; width:3px; height:8px;
          background:#080808; border-radius:0 2px 2px 0;
        }

        .header {
          height: 112px;
          display:flex;
          align-items:center;
          padding: 10px 39px 10px 31px;
        }
        .back {
          width:44px;
          height:44px;
          display:flex;
          align-items:center;
          justify-content:center;
          margin-right:16px;
        }
        .back::before {
          content:"";
          width:17px;
          height:17px;
          border-left:4px solid #0f203a;
          border-bottom:4px solid #0f203a;
          transform:rotate(45deg);
          margin-left:8px;
        }
        .header-title {
          font-size:34px;
          font-weight:900;
          letter-spacing:.5px;
        }
        .add-btn {
          margin-left:auto;
          border:0;
          height:64px;
          padding:0 24px;
          border-radius:13px;
          background:linear-gradient(120deg,#ff3277,#ff4e86);
          color:white;
          font-size:25px;
          font-weight:700;
          box-shadow:0 8px 18px rgba(255,50,119,.14);
        }
        .add-btn .plus {
          font-size:36px;
          vertical-align:-2px;
          margin-right:5px;
          font-weight:300;
        }

        .list {
          position:absolute;
          left:27px;
          right:27px;
          top:176px;
          bottom:91px;
          padding-top:8px;
        }
        .account-card {
          height:174px;
          background:white;
          border:1px solid #edf1f5;
          border-radius:18px;
          box-shadow:0 7px 22px rgba(33,61,96,.055);
          display:flex;
          align-items:center;
          padding:20px 21px 19px 20px;
          margin-bottom:17px;
        }
        .account-card.compact { height:157px; }
        .avatar {
          width:96px;
          height:96px;
          flex:0 0 96px;
          border-radius:50%;
          overflow:hidden;
          background:#edf4fa;
          position:relative;
        }
        .avatar img {
          width:100%;
          height:100%;
          display:block;
          object-fit:cover;
        }
        .state-dot {
          position:absolute;
          right:-1px;
          bottom:1px;
          width:28px;
          height:28px;
          border-radius:50%;
          border:4px solid white;
          display:flex;
          align-items:center;
          justify-content:center;
          color:white;
          font-size:15px;
          font-weight:900;
        }
        .state-dot.ok { background:#10bf66; }
        .state-dot.bad { background:#ff315d; }
        .details {
          margin-left:23px;
          min-width:0;
          flex:1;
        }
        .line1 {
          display:flex;
          align-items:center;
          min-height:35px;
        }
        .account-name {
          font-size:28px;
          line-height:1;
          font-weight:900;
        }
        .nickname {
          margin-top:10px;
          color:#627693;
          font-size:23px;
          line-height:1.05;
        }
        .meta {
          margin-top:8px;
          color:#6f819c;
          font-size:20px;
          line-height:1.05;
          white-space:nowrap;
        }
        .tag {
          margin-left:auto;
          padding:10px 16px;
          border-radius:10px;
          font-size:21px;
          line-height:1;
          font-weight:900;
          white-space:nowrap;
        }
        .tag.ok { color:#0caf61; background:#e4f9ef; }
        .tag.cool { color:#ff6f10; background:#fff0e4; }
        .tag.fail { color:#ff2455; background:#ffe8ee; }
        .tag.idle { color:#71819a; background:#eef2f6; }
        .cooldown {
          margin-top:13px;
          color:#ff6810;
          font-size:20px;
          font-weight:900;
        }
        .more {
          width:34px;
          margin-left:12px;
          display:flex;
          flex-direction:column;
          align-items:center;
          gap:5px;
        }
        .more i {
          width:4px;
          height:4px;
          border-radius:50%;
          background:#10203a;
        }
        .nav {
          position:absolute;
          left:0;
          right:0;
          bottom:0;
          height:91px;
          border-top:1px solid #e6ebf1;
          background:#fff;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:8px 18px 6px;
        }
        .nav-item {
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          color:#687b95;
          font-size:18px;
        }
        .nav-item.active { color:var(--pink); }
        .nav-item svg {
          width:31px;
          height:31px;
          stroke:currentColor;
          fill:none;
          stroke-width:2.3;
          stroke-linecap:round;
          stroke-linejoin:round;
        }
        .nav-item.active .fill { fill:currentColor; stroke:currentColor; }
    </style>
</head>
