<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3. 扫码登录</title>
    <style>
        :root {
          --navy:#10213c;
          --muted:#78879d;
          --pink:#ff3478;
          --blue:#2c7df7;
          --line:#e8edf3;
          --surface:#fff;
        }
        *{box-sizing:border-box}
        html,body{
          margin:0;
          min-height:100%;
          background:#f8fbff;
          font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color:var(--navy);
        }
        body{display:flex;justify-content:center;align-items:flex-start}
        .canvas{
          position:relative;
          width:1086px;
          height:1448px;
          overflow:hidden;
          background:
            radial-gradient(ellipse at 50% 28%,rgba(220,232,246,.68),rgba(248,251,255,0) 48%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 54%,#f5f9fd 100%);
        }
        .page-title{
          position:absolute;
          top:39px;
          left:0;
          width:100%;
          text-align:center;
          font-size:51px;
          line-height:1;
          font-weight:900;
          letter-spacing:.5px;
          color:#10213d;
        }
        .phone{
          position:absolute;
          left:229px;
          top:126px;
          width:628px;
          height:1255px;
          border-radius:83px;
          background:linear-gradient(135deg,#e6ebef 0%,#9097a0 4%,#101319 8%,#020304 16%,#06080b 83%,#2a3037 92%,#d9dee3 98%);
          box-shadow:0 18px 38px rgba(22,40,63,.22),0 3px 7px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.45);
        }
        .phone::before{
          content:"";
          position:absolute;
          right:-7px;
          top:271px;
          width:8px;
          height:150px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .phone::after{
          content:"";
          position:absolute;
          right:-7px;
          top:451px;
          width:8px;
          height:84px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .screen{
          position:absolute;
          inset:16px;
          border-radius:66px;
          overflow:hidden;
          background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
          box-shadow:inset 0 0 0 1px rgba(18,32,55,.06);
        }
        .camera{
          position:absolute;
          z-index:20;
          top:19px;
          left:50%;
          transform:translateX(-50%);
          width:31px;
          height:31px;
          border-radius:50%;
          background:radial-gradient(circle at 53% 44%,#54708c 0 9%,#101922 12% 26%,#020305 29% 100%);
          box-shadow:0 0 0 3px rgba(9,16,24,.10);
        }
        .statusbar{
          height:62px;
          padding:18px 34px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:21px;
          font-weight:900;
          color:#111;
        }
        .status-icons{display:flex;align-items:center;gap:9px}
        .signal{height:18px;display:flex;align-items:flex-end;gap:2px}
        .signal i{display:block;width:4px;background:#080808;border-radius:2px}
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi{width:23px;height:17px;position:relative}
        .wifi::before{
          content:"";position:absolute;left:1px;right:1px;top:0;height:12px;border-top:5px solid #080808;border-radius:50%;
        }
        .wifi::after{
          content:"";position:absolute;left:8px;top:9px;width:7px;height:7px;border-radius:50%;background:#080808;
        }
        .battery{width:20px;height:20px;border-radius:3px;background:#080808;position:relative}
        .battery::after{
          content:"";position:absolute;right:-4px;top:5px;width:3px;height:8px;background:#080808;border-radius:0 2px 2px 0;
        }

        .header{
          height:110px;
          display:flex;
          align-items:center;
          padding:10px 31px;
        }
        .back{
          width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:16px;
        }
        .back::before{
          content:"";width:17px;height:17px;border-left:4px solid #0f203a;border-bottom:4px solid #0f203a;
          transform:rotate(45deg);margin-left:8px;
        }
        .header-title{font-size:34px;font-weight:900;letter-spacing:.3px}

        .steps{
          height:92px;
          display:flex;
          align-items:center;
          padding:0 38px;
          gap:8px;
        }
        .step{
          display:flex;
          align-items:center;
          gap:10px;
          color:#9aa6b8;
          font-size:22px;
          font-weight:700;
          white-space:nowrap;
        }
        .step.active{color:#17233c}
        .circle{
          width:40px;height:40px;border-radius:50%;
          display:flex;align-items:center;justify-content:center;
          background:#edf2f7;color:#8c9bb0;
          font-size:20px;font-weight:900;
        }
        .step.active .circle{background:#2d7df6;color:white}
        .connector{
          width:20px;height:3px;border-radius:2px;background:#dce3eb;flex:0 0 auto;
        }
        .login-card{
          position:absolute;
          left:28px;right:28px;
          top:264px;
          bottom:109px;
          background:#fff;
          border:1px solid #edf1f5;
          border-radius:20px;
          box-shadow:0 8px 24px rgba(35,65,100,.055);
          padding-top:51px;
          text-align:center;
        }
        .qr-wrap{
          width:291px;
          height:283px;
          margin:0 auto;
          display:flex;
          align-items:center;
          justify-content:center;
        }
        .qr-wrap img{
          display:block;
          width:291px;
          height:283px;
          object-fit:cover;
        }
        .login-title{
          margin-top:31px;
          font-size:28px;
          line-height:1.35;
          font-weight:900;
        }
        .login-title .pink{color:var(--pink)}
        .desc{
          margin-top:30px;
          color:#75859d;
          font-size:25px;
          line-height:1.7;
        }
        .refresh{
          margin:44px auto 0;
          width:390px;
          height:78px;
          border-radius:13px;
          border:2px solid var(--pink);
          background:white;
          color:var(--pink);
          display:flex;
          align-items:center;
          justify-content:center;
          gap:15px;
          font-size:27px;
          font-weight:800;
        }
        .refresh-icon{
          position:relative;
          width:31px;
          height:31px;
          border:4px solid var(--pink);
          border-right-color:transparent;
          border-radius:50%;
        }
        .refresh-icon::after{
          content:"";
          position:absolute;
          right:-4px;
          top:-1px;
          border-left:8px solid var(--pink);
          border-top:5px solid transparent;
          border-bottom:5px solid transparent;
          transform:rotate(18deg);
        }
        .other{
          margin-top:34px;
          color:#2c7df7;
          font-size:25px;
          font-weight:700;
        }
        .other::after{
          content:"";
          display:inline-block;
          width:12px;height:12px;
          border-top:3px solid currentColor;
          border-right:3px solid currentColor;
          transform:rotate(45deg);
          margin-left:9px;
          vertical-align:2px;
        }

        .nav{
          position:absolute;
          left:0;right:0;bottom:0;
          height:91px;
          border-top:1px solid #e6ebf1;
          background:#fff;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:8px 18px 6px;
        }
        .nav-item{
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          color:#687b95;
          font-size:18px;
        }
        .nav-item svg{
          width:31px;height:31px;
          stroke:currentColor;
          fill:none;
          stroke-width:2.3;
          stroke-linecap:round;
          stroke-linejoin:round;
        }
    </style>
</head>
