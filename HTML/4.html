<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>4. 账号登录成功</title>
    <style>
        :root {
          --navy:#10213c;
          --muted:#72839b;
          --pink:#ff3478;
          --pink2:#ff4e86;
          --green:#13be71;
          --blue:#2d7ef7;
          --line:#e5ebf1;
        }
        *{box-sizing:border-box}
        html,body{
          margin:0;
          min-height:100%;
          background:#f7fbff;
          font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color:var(--navy);
        }
        body{display:flex;justify-content:center;align-items:flex-start}
        .canvas{
          position:relative;
          width:1086px;
          height:1448px;
          overflow:hidden;
          background:
            radial-gradient(ellipse at 50% 28%,rgba(220,232,245,.70),rgba(248,251,255,0) 49%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 55%,#f5f9fd 100%);
        }
        .page-title{
          position:absolute;
          top:39px;
          left:0;
          width:100%;
          text-align:center;
          font-size:49px;
          line-height:1;
          font-weight:900;
          color:#10213d;
          letter-spacing:.5px;
        }
        .phone{
          position:absolute;
          left:229px;
          top:126px;
          width:628px;
          height:1255px;
          border-radius:83px;
          background:linear-gradient(135deg,#e6ebef 0%,#9097a0 4%,#101319 8%,#020304 16%,#06080b 83%,#2a3037 92%,#d9dee3 98%);
          box-shadow:0 18px 38px rgba(22,40,63,.22),0 3px 7px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.45);
        }
        .phone::before{
          content:"";
          position:absolute;
          right:-7px;
          top:271px;
          width:8px;
          height:150px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .phone::after{
          content:"";
          position:absolute;
          right:-7px;
          top:451px;
          width:8px;
          height:84px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .screen{
          position:absolute;
          inset:16px;
          border-radius:66px;
          overflow:hidden;
          background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
          box-shadow:inset 0 0 0 1px rgba(18,32,55,.06);
        }
        .camera{
          position:absolute;
          z-index:20;
          top:19px;
          left:50%;
          transform:translateX(-50%);
          width:31px;
          height:31px;
          border-radius:50%;
          background:radial-gradient(circle at 53% 44%,#54708c 0 9%,#101922 12% 26%,#020305 29% 100%);
          box-shadow:0 0 0 3px rgba(9,16,24,.10);
        }
        .statusbar{
          height:62px;
          padding:18px 34px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:21px;
          font-weight:900;
          color:#111;
        }
        .status-icons{display:flex;align-items:center;gap:9px}
        .signal{height:18px;display:flex;align-items:flex-end;gap:2px}
        .signal i{display:block;width:4px;background:#080808;border-radius:2px}
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi{width:23px;height:17px;position:relative}
        .wifi::before{content:"";position:absolute;left:1px;right:1px;top:0;height:12px;border-top:5px solid #080808;border-radius:50%}
        .wifi::after{content:"";position:absolute;left:8px;top:9px;width:7px;height:7px;border-radius:50%;background:#080808}
        .battery{width:20px;height:20px;border-radius:3px;background:#080808;position:relative}
        .battery::after{content:"";position:absolute;right:-4px;top:5px;width:3px;height:8px;background:#080808;border-radius:0 2px 2px 0}

        .header{
          height:104px;
          display:flex;
          align-items:center;
          padding:8px 31px;
        }
        .back{
          width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:14px;
        }
        .back::before{
          content:"";width:17px;height:17px;border-left:4px solid #0f203a;border-bottom:4px solid #0f203a;
          transform:rotate(45deg);margin-left:8px;
        }
        .header-title{font-size:34px;font-weight:900;letter-spacing:.3px}

        .main{
          position:absolute;
          top:166px;
          left:0;right:0;bottom:91px;
          padding:0 31px 18px;
          text-align:center;
        }
        .success-area{
          height:248px;
          position:relative;
        }
        .success-ring{
          position:absolute;
          left:50%;
          top:38px;
          transform:translateX(-50%);
          width:164px;
          height:164px;
        }
        .success-ring::before{
          content:"";
          position:absolute;
          inset:0;
          border-radius:50%;
          background:
            conic-gradient(from 15deg,
              rgba(69,218,158,.22) 0 80deg,
              rgba(69,218,158,.04) 80deg 115deg,
              rgba(69,218,158,.23) 115deg 240deg,
              rgba(69,218,158,.04) 240deg 285deg,
              rgba(69,218,158,.22) 285deg 360deg);
          -webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);
                  mask:radial-gradient(circle,transparent 61%,#000 63%);
        }
        .success-circle{
          position:absolute;
          left:19px;top:19px;
          width:126px;height:126px;
          border-radius:50%;
          background:linear-gradient(145deg,#58dca6,#10bd6b);
          box-shadow:0 10px 22px rgba(31,190,113,.18);
        }
        .success-circle::before{
          content:"";
          position:absolute;
          width:54px;height:28px;
          left:34px;top:40px;
          border-left:10px solid white;
          border-bottom:10px solid white;
          transform:rotate(-45deg);
          border-radius:2px;
        }
        .spark{
          position:absolute;width:14px;height:14px;transform:rotate(45deg);border-radius:2px;
        }
        .s1{left:78px;top:83px;background:#ff8f9f}
        .s2{left:111px;top:124px;background:#59d8a5}
        .s3{right:89px;top:109px;background:#ffa30a}
        .s4{right:143px;top:74px;background:#ccefe5}
        .s5{left:60px;top:178px;background:#e7e66b}
        .s6{right:132px;top:145px;background:#e58bea}
        .big-title{
          margin-top:5px;
          font-size:39px;
          font-weight:900;
          line-height:1;
        }
        .avatar{
          width:141px;
          height:141px;
          border-radius:50%;
          overflow:hidden;
          margin:29px auto 18px;
          background:#edf4fb;
          box-shadow:0 3px 8px rgba(31,50,79,.06);
        }
        .avatar img{width:100%;height:100%;object-fit:cover}

        .info-card{
          width:100%;
          height:300px;
          background:#fff;
          border:1px solid #dfe7ee;
          border-radius:18px;
          box-shadow:0 7px 20px rgba(35,65,100,.045);
          text-align:left;
          padding:24px 24px 18px;
        }
        .info-title{
          font-size:28px;
          font-weight:900;
          margin-bottom:15px;
        }
        .info-row{
          height:58px;
          display:grid;
          grid-template-columns:190px 1fr;
          align-items:center;
          border-bottom:1px solid #dce4ec;
          font-size:24px;
        }
        .info-row:last-child{border-bottom:none}
        .label{color:#71819b}
        .value{color:#111b2d;font-weight:700}
        .value.ok{color:#12b96b;font-weight:900}

        .check-row{
          height:70px;
          display:flex;
          align-items:center;
          text-align:left;
          padding-left:12px;
          gap:14px;
          font-size:24px;
          color:#51647f;
        }
        .checkbox{
          width:35px;height:35px;border-radius:6px;background:#2e80f5;position:relative;flex:0 0 35px;
        }
        .checkbox::before{
          content:"";
          position:absolute;
          left:9px;top:7px;
          width:14px;height:8px;
          border-left:4px solid #fff;
          border-bottom:4px solid #fff;
          transform:rotate(-45deg);
        }
        .done{
          width:100%;
          height:74px;
          border:0;
          border-radius:12px;
          background:linear-gradient(90deg,#ff3277,#ff4a84);
          color:white;
          font-size:30px;
          font-weight:800;
          box-shadow:0 7px 18px rgba(255,55,119,.12);
        }

        .nav{
          position:absolute;
          left:0;right:0;bottom:0;
          height:91px;
          border-top:1px solid #e6ebf1;
          background:#fff;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:8px 18px 6px;
        }
        .nav-item{
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          color:#687b95;
          font-size:18px;
        }
        .nav-item.active{color:var(--pink)}
        .nav-item svg{
          width:31px;height:31px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round
        }
        .nav-item.active .fill{fill:currentColor;stroke:currentColor}
    </style>
</head>
