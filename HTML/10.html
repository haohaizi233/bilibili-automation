<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>10. 设置页面</title>
    <style>
        :root {
          --navy:#10213c;
          --muted:#71829a;
          --pink:#ff3478;
          --line:#e7edf3;
          --surface:#ffffff;
        }
        *{box-sizing:border-box}
        html,body{
          margin:0;
          min-height:100%;
          background:#f8fbff;
          font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color:var(--navy);
        }
        body{display:flex;justify-content:center;align-items:flex-start}
        .canvas{
          position:relative;
          width:941px;
          height:1672px;
          overflow:hidden;
          background:
            radial-gradient(ellipse at 50% 28%,rgba(222,233,245,.56),rgba(248,251,255,0) 48%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 100%);
        }
        .page-title{
          position:absolute;
          top:35px;
          left:0;
          width:100%;
          text-align:center;
          font-size:49px;
          line-height:1;
          font-weight:900;
          letter-spacing:.4px;
          color:#10213d;
        }
        .phone{
          position:absolute;
          left:115px;
          top:145px;
          width:699px;
          height:1448px;
          border-radius:52px;
          background:linear-gradient(135deg,#eef2f5 0%,#d9dee4 48%,#f6f8fa 100%);
          box-shadow:0 14px 31px rgba(26,45,68,.13),0 2px 5px rgba(0,0,0,.08);
        }
        .screen{
          position:absolute;
          inset:9px;
          border-radius:43px;
          overflow:hidden;
          background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
          box-shadow:inset 0 0 0 1px rgba(18,32,55,.05);
        }
        .statusbar{
          height:71px;
          padding:22px 47px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:21px;
          font-weight:900;
          color:#111;
        }
        .status-icons{display:flex;align-items:center;gap:9px}
        .signal{height:18px;display:flex;align-items:flex-end;gap:2px}
        .signal i{display:block;width:4px;background:#080808;border-radius:2px}
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi{width:23px;height:17px;position:relative}
        .wifi::before{content:"";position:absolute;left:1px;right:1px;top:0;height:12px;border-top:5px solid #080808;border-radius:50%}
        .wifi::after{content:"";position:absolute;left:8px;top:9px;width:7px;height:7px;border-radius:50%;background:#080808}
        .battery{width:20px;height:20px;border-radius:3px;background:#080808;position:relative}
        .battery::after{content:"";position:absolute;right:-4px;top:5px;width:3px;height:8px;background:#080808;border-radius:0 2px 2px 0}

        .header{
          height:112px;
          display:flex;
          align-items:center;
          padding:7px 37px;
        }
        .back{
          width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:18px;
        }
        .back::before{
          content:"";width:17px;height:17px;border-left:4px solid #10213c;border-bottom:4px solid #10213c;
          transform:rotate(45deg);margin-left:8px;
        }
        .header-title{font-size:36px;font-weight:900}

        .content{
          position:absolute;
          left:34px;right:34px;
          top:183px;
          bottom:104px;
        }
        .group{
          background:#fff;
          border:1px solid #edf1f5;
          border-radius:18px;
          box-shadow:0 7px 22px rgba(33,61,96,.05);
          overflow:hidden;
        }
        .group + .group{margin-top:34px}
        .group-title{
          height:86px;
          display:flex;
          align-items:center;
          padding:0 31px;
          font-size:29px;
          font-weight:900;
          border-bottom:1px solid #edf1f5;
        }
        .row{
          height:96px;
          display:grid;
          grid-template-columns:58px 1fr auto 32px;
          align-items:center;
          padding:0 28px 0 31px;
          color:#52657f;
        }
        .row:not(:last-child) .row-main{
          border-bottom:1px solid #dfe6ed;
        }
        .row-main{
          height:100%;
          display:flex;
          align-items:center;
          font-size:27px;
        }
        .row-value{
          font-size:24px;
          color:#76869c;
          padding-left:14px;
        }
        .chev{
          width:14px;height:14px;
          border-top:3px solid #7b8a9f;
          border-right:3px solid #7b8a9f;
          transform:rotate(45deg);
          justify-self:end;
        }
        .icon{
          width:34px;height:34px;
          color:#5b6f8c;
          position:relative;
        }
        .icon.export::before{
          content:"";
          position:absolute;
          left:5px;right:5px;bottom:2px;height:18px;
          border:3px solid currentColor;border-top:none;border-radius:0 0 4px 4px;
        }
        .icon.export::after{
          content:"";
          position:absolute;
          left:15px;top:1px;width:4px;height:19px;background:currentColor;
          box-shadow:0 -1px 0 currentColor;
        }
        .icon.export span::before{
          content:"";position:absolute;left:10px;top:4px;width:10px;height:10px;
          border-left:3px solid currentColor;border-top:3px solid currentColor;transform:rotate(45deg);
        }
        .icon.import::before{
          content:"";
          position:absolute;
          left:5px;right:5px;bottom:2px;height:18px;
          border:3px solid currentColor;border-top:none;border-radius:0 0 4px 4px;
        }
        .icon.import::after{
          content:"";
          position:absolute;
          left:15px;top:1px;width:4px;height:19px;background:currentColor;
        }
        .icon.import span::before{
          content:"";position:absolute;left:10px;top:11px;width:10px;height:10px;
          border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);
        }
        .icon.trash::before{
          content:"";position:absolute;left:8px;right:8px;top:10px;bottom:2px;
          border:3px solid currentColor;border-radius:3px;
        }
        .icon.trash::after{
          content:"";position:absolute;left:7px;right:7px;top:6px;height:3px;background:currentColor;border-radius:2px;
        }
        .icon.theme::before{
          content:"";position:absolute;inset:3px;border:3px solid currentColor;border-radius:50%;
        }
        .icon.theme::after{
          content:"";position:absolute;left:5px;top:5px;width:14px;height:24px;border-radius:18px 0 0 18px;background:currentColor;
        }
        .icon.bell::before{
          content:"";position:absolute;left:7px;right:7px;top:6px;height:21px;
          border:3px solid currentColor;border-radius:15px 15px 8px 8px;
        }
        .icon.bell::after{
          content:"";position:absolute;left:13px;bottom:0;width:8px;height:4px;background:currentColor;border-radius:0 0 6px 6px;
        }
        .icon.info::before{
          content:"i";position:absolute;inset:2px;border:3px solid currentColor;border-radius:50%;
          display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;line-height:1;
        }
        .icon.code::before{
          content:"‹›";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          font-size:44px;font-weight:500;letter-spacing:-8px;color:currentColor;
        }

        .logout{
          width:100%;
          height:108px;
          margin-top:37px;
          border:0;
          border-radius:14px;
          background:linear-gradient(90deg,#ff3478,#ff4783);
          color:#fff;
          font-size:31px;
          font-weight:900;
          box-shadow:0 8px 18px rgba(255,55,119,.12);
        }

        .nav{
          position:absolute;
          left:0;right:0;bottom:0;
          height:104px;
          border-top:1px solid #e6ebf1;
          background:#fff;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:10px 30px 8px;
        }
        .nav-item{
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          color:#6d8098;
          font-size:20px;
        }
        .nav-item.active{color:var(--pink)}
        .nav-item svg{
          width:33px;height:33px;
          stroke:currentColor;
          fill:none;
          stroke-width:2.3;
          stroke-linecap:round;
          stroke-linejoin:round;
        }
        .nav-item.active .fill{fill:currentColor;stroke:currentColor}
        .home-indicator{
          position:absolute;
          left:50%;
          bottom:7px;
          transform:translateX(-50%);
          width:190px;
          height:9px;
          border-radius:8px;
          background:#d1d5db;
        }
    </style>
</head>
<body>
<div class="canvas">
    <div class="page-title">10. 设置页面</div>

    <div class="phone">
        <div class="screen">
            <div class="statusbar">
                <div>9:41</div>
                <div class="status-icons">
                    <div class="signal"><i></i><i></i><i></i><i></i></div>
                    <div class="wifi"></div>
                    <div class="battery"></div>
                </div>
            </div>

            <div class="header">
                <div class="back"></div>
                <div class="header-title">设置</div>
            </div>

            <main class="content">
                <section class="group">
                    <div class="group-title">数据管理</div>

                    <div class="row">
                        <div class="icon export"><span></span></div>
                        <div class="row-main">导出数据</div>
                        <div></div>
                        <div class="chev"></div>
                    </div>

                    <div class="row">
                        <div class="icon import"><span></span></div>
                        <div class="row-main">导入数据</div>
                        <div></div>
                        <div class="chev"></div>
                    </div>

                    <div class="row">
                        <div class="icon trash"></div>
                        <div class="row-main">清空历史记录</div>
                        <div></div>
                        <div class="chev"></div>
                    </div>
                </section>

                <section class="group">
                    <div class="group-title">应用设置</div>

                    <div class="row">
                        <div class="icon theme"></div>
                        <div class="row-main">主题模式</div>
                        <div class="row-value">跟随系统</div>
                        <div class="chev"></div>
                    </div>

                    <div class="row">
                        <div class="icon bell"></div>
                        <div class="row-main">通知设置</div>
                        <div></div>
                        <div class="chev"></div>
                    </div>

                    <div class="row">
                        <div class="icon info"></div>
                        <div class="row-main">关于应用</div>
                        <div></div>
                        <div class="chev"></div>
                    </div>

                    <div class="row">
                        <div class="icon code"></div>
                        <div class="row-main">版本号</div>
                        <div class="row-value">v1.0.0</div>
                        <div class="chev"></div>
                    </div>
                </section>

                <button class="logout">退出登录</button>
            </main>

            <nav class="nav">
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 11.3 12 4l9 7.3V21h-6v-6H9v6H3z"/></svg>
                    <span>首页</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21c.8-5 3.2-7 7.5-7s6.7 2 7.5 7"/></svg>
                    <span>账号</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-7-10a4.2 4.2 0 0 1 7-3.1A4.2 4.2 0 0 1 19 11c0 5.4-7 10-7 10Z"/><path d="m9.6 11.4 2.4 2.4 2.8-3"/></svg>
                    <span>目标UP</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="15" rx="2"/><path d="M8 5h8M9 3h6v4H9z"/><path d="m9 13 2 2 4-4"/></svg>
                    <span>任务</span>
                </div>
                <div class="nav-item active">
                    <svg viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 14.8 6L14.5 3h-5l-.3 3a7 7 0 0 0-1.7 1.1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1A7 7 0 0 0 9.2 18l.3 3h5l.3-3a7 7 0 0 0 1.7-1.1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"/></svg>
                    <span>设置</span>
                </div>
            </nav>

            <div class="home-indicator"></div>
        </div>
    </div>
</div>
</body>
</html>
