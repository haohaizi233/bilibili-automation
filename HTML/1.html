<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili 自动化助手 - 首页控制面板</title>
    <style>
        * {
          box-sizing: border-box;
        }
        html, body {
          margin: 0;
          min-height: 100%;
          background: #f8fbff;
          color: #0d1b34;
          font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
        }
        body {
          display: flex;
          justify-content: center;
        }
        .stage {
          width: 1086px;
          height: 1448px;
          position: relative;
          overflow: hidden;
          background:
            radial-gradient(circle at 50% 35%, rgba(225,236,248,.45), rgba(248,251,255,0) 50%),
            linear-gradient(180deg,#fbfdff 0%,#f5f9fd 100%);
        }
        .page-title {
          position: absolute;
          top: 38px;
          left: 0;
          width: 100%;
          text-align: center;
          font-size: 48px;
          line-height: 1.15;
          font-weight: 800;
          letter-spacing: 1px;
          color: #10213d;
        }
        .phone {
          position: absolute;
          left: 237px;
          top: 128px;
          width: 612px;
          height: 1246px;
          border-radius: 78px;
          background: linear-gradient(145deg,#cfd5dc 0%,#171b21 9%,#030507 18%,#0b0e12 82%,#343a42 92%,#d7dde3 100%);
          box-shadow:
            0 18px 38px rgba(48,67,92,.20),
            0 2px 6px rgba(14,25,43,.24),
            inset 0 0 0 2px rgba(255,255,255,.45);
        }
        .phone::before {
          content:"";
          position:absolute;
          right:-7px;
          top:270px;
          width:7px;
          height:145px;
          border-radius:0 4px 4px 0;
          background:linear-gradient(#b8bec7,#343942,#c2c7ce);
        }
        .phone::after {
          content:"";
          position:absolute;
          right:-7px;
          top:450px;
          width:7px;
          height:85px;
          border-radius:0 4px 4px 0;
          background:linear-gradient(#b8bec7,#343942,#c2c7ce);
        }
        .screen {
          position: absolute;
          inset: 16px;
          border-radius: 63px;
          overflow: hidden;
          background:
            linear-gradient(180deg, #ffffff 0%, #fbfcfe 54%, #f8fafc 100%);
          box-shadow: inset 0 0 0 1px rgba(30,42,60,.08);
        }
        .camera {
          position: absolute;
          z-index: 20;
          top: 19px;
          left: 50%;
          transform: translateX(-50%);
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background:
            radial-gradient(circle at 53% 44%,#56708d 0 9%,#0e1721 12% 25%,#020406 28% 100%);
          box-shadow: 0 0 0 3px rgba(12,17,23,.12);
        }
        .statusbar {
          height: 62px;
          padding: 18px 34px 0 35px;
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          font-size: 21px;
          line-height: 1;
          font-weight: 800;
          color: #111;
        }
        .status-icons {
          display:flex;
          align-items:center;
          gap:9px;
        }
        .sig {
          display:flex;
          align-items:flex-end;
          gap:2px;
          height:18px;
        }
        .sig span {
          width:4px;
          background:#080808;
          border-radius:2px;
        }
        .sig span:nth-child(1){height:7px}
        .sig span:nth-child(2){height:10px}
        .sig span:nth-child(3){height:14px}
        .sig span:nth-child(4){height:18px}
        .wifi {
          width:22px;
          height:16px;
          position:relative;
        }
        .wifi::before {
          content:"";
          position:absolute;
          inset:0;
          border-radius:50%;
          border-top:5px solid #080808;
          transform:scaleX(1.15);
        }
        .wifi::after {
          content:"";
          position:absolute;
          left:8px;
          top:8px;
          width:7px;
          height:7px;
          border-radius:50%;
          background:#080808;
        }
        .battery {
          width:20px;
          height:19px;
          border:3px solid #080808;
          border-radius:3px;
          position:relative;
          background:#080808;
        }
        .battery::after {
          content:"";
          position:absolute;
          right:-5px;
          top:4px;
          width:3px;
          height:7px;
          background:#080808;
          border-radius:0 2px 2px 0;
        }
        .app {
          position:absolute;
          top:62px;
          left:0;
          right:0;
          bottom:91px;
          padding: 32px 27px 18px;
          overflow:hidden;
        }
        .brand {
          display:flex;
          align-items:center;
          gap:18px;
          padding: 8px 2px 24px;
        }
        .brand-logo {
          width:80px;
          height:80px;
          object-fit:contain;
          flex:0 0 auto;
        }
        .brand-text {
          min-width:0;
        }
        .brand-title {
          font-size:35px;
          line-height:1.05;
          font-weight:900;
          letter-spacing:.2px;
          color:#0b1830;
          white-space:nowrap;
        }
        .brand-sub {
          margin-top:9px;
          font-size:22px;
          color:#75839a;
          font-weight:500;
        }
        .card {
          background:#fff;
          border:1px solid #edf1f6;
          border-radius:18px;
          box-shadow:0 7px 24px rgba(39,70,108,.055);
        }
        .task-card {
          height:172px;
          border-radius:18px;
          padding:32px 28px;
          display:flex;
          justify-content:space-between;
          align-items:center;
          color:#fff;
          background:
            linear-gradient(120deg,#ff2d72 0%,#ff4f86 58%,#ff6a9a 100%);
          box-shadow:0 10px 22px rgba(255,55,119,.17);
        }
        .task-label {
          font-size:29px;
          font-weight:800;
          margin-bottom:12px;
        }
        .task-time {
          font-size:52px;
          line-height:1;
          font-weight:800;
          letter-spacing:1px;
        }
        .pause-wrap {
          width:96px;
          text-align:center;
        }
        .pause-btn {
          width:82px;
          height:82px;
          margin:0 auto 7px;
          border-radius:50%;
          background:#fff;
          display:flex;
          justify-content:center;
          align-items:center;
          box-shadow:0 4px 13px rgba(156,22,70,.11);
        }
        .pause-icon {
          display:flex;
          gap:9px;
        }
        .pause-icon i {
          display:block;
          width:11px;
          height:34px;
          border-radius:4px;
          background:#ff2f78;
        }
        .pause-text {
          font-size:22px;
          font-weight:600;
        }
        .info-card {
          margin-top:18px;
          height:111px;
          display:flex;
          align-items:center;
          padding:15px 20px;
        }
        .avatar {
          width:70px;
          height:70px;
          flex:0 0 70px;
          overflow:hidden;
          border-radius:50%;
          background:#eef5fb;
        }
        .avatar img {
          width:100%;
          height:100%;
          object-fit:cover;
        }
        .info-main {
          margin-left:18px;
          flex:1;
          min-width:0;
        }
        .info-title {
          font-size:26px;
          font-weight:900;
          line-height:1.2;
        }
        .info-sub {
          margin-top:7px;
          font-size:20px;
          line-height:1.2;
          color:#74849c;
          white-space:nowrap;
        }
        .badge {
          margin-left:10px;
          padding:8px 14px;
          border-radius:9px;
          background:#e6faf0;
          color:#10a75c;
          font-size:20px;
          line-height:1;
          font-weight:800;
        }
        .dots {
          width:28px;
          display:flex;
          flex-direction:column;
          align-items:center;
          gap:5px;
          margin-left:11px;
        }
        .dots i {
          width:4px;
          height:4px;
          border-radius:50%;
          background:#11213a;
        }
        .progress-card {
          height:107px;
          margin-top:18px;
          padding:21px 20px;
        }
        .row-title {
          display:flex;
          align-items:center;
          justify-content:space-between;
        }
        .progress-title {
          font-size:25px;
          font-weight:900;
        }
        .progress-value {
          font-size:23px;
          color:#708099;
        }
        .progress-line {
          display:flex;
          align-items:center;
          gap:18px;
          margin-top:14px;
        }
        .track {
          height:17px;
          flex:1;
          border-radius:9px;
          background:#e9eef4;
          overflow:hidden;
        }
        .fill {
          width:10%;
          height:100%;
          border-radius:9px;
          background:linear-gradient(90deg,#2a7cf6,#58a2ff);
        }
        .percent {
          width:43px;
          text-align:right;
          font-size:21px;
          color:#75849a;
        }
        .today {
          height:181px;
          margin-top:18px;
          padding:20px 20px 18px;
        }
        .today h3 {
          margin:0 0 15px;
          font-size:26px;
          line-height:1;
          font-weight:900;
        }
        .metric-row {
          display:grid;
          grid-template-columns: repeat(3, 1fr);
          gap:12px;
        }
        .metric {
          height:96px;
          border-radius:13px;
          text-align:center;
          padding-top:14px;
          background:#f0f6ff;
        }
        .metric:nth-child(2) {
          background:#f4f7fb;
        }
        .metric:nth-child(3) {
          background:#fff0f3;
        }
        .metric-label {
          font-size:21px;
          color:#1f2d45;
        }
        .metric-value {
          margin-top:7px;
          font-size:32px;
          line-height:1;
          font-weight:900;
          color:#0b1830;
        }
        .stop-btn {
          width:100%;
          height:74px;
          margin-top:17px;
          border:0;
          border-radius:12px;
          color:#fff;
          font-size:28px;
          font-weight:800;
          background:linear-gradient(90deg,#ff2d72,#ff3d7c);
          box-shadow:0 8px 18px rgba(255,55,119,.13);
        }
        .nav {
          position:absolute;
          left:0;
          right:0;
          bottom:0;
          height:91px;
          border-top:1px solid #e7ecf2;
          background:rgba(255,255,255,.98);
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:9px 18px 7px;
        }
        .nav-item {
          color:#667a95;
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          font-size:18px;
          font-weight:500;
        }
        .nav-item.active {
          color:#ff2d72;
        }
        .nav svg {
          width:32px;
          height:32px;
          stroke:currentColor;
          fill:none;
          stroke-width:2.4;
          stroke-linecap:round;
          stroke-linejoin:round;
        }
        .home-fill {
          fill:currentColor !important;
          stroke:currentColor !important;
        }
    </style>
</head>
