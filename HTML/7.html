<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>7. 任务设置</title>
    <style>
        :root {
          --navy:#10213c;
          --muted:#71829a;
          --pink:#ff3478;
          --blue:#2f7df5;
          --line:#e7edf3;
          --surface:#ffffff;
        }
        *{box-sizing:border-box}
        html,body{
          margin:0;
          min-height:100%;
          background:#f8fbff;
          font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
          color:var(--navy);
        }
        body{display:flex;justify-content:center;align-items:flex-start}
        .canvas{
          position:relative;
          width:941px;
          height:1672px;
          overflow:hidden;
          background:
            radial-gradient(ellipse at 50% 30%,rgba(220,232,245,.55),rgba(248,251,255,0) 48%),
            linear-gradient(180deg,#fbfdff 0%,#f7fbff 100%);
        }
        .page-title{
          position:absolute;
          top:34px;
          left:0;
          width:100%;
          text-align:center;
          font-size:49px;
          line-height:1;
          font-weight:900;
          letter-spacing:.4px;
          color:#10213d;
        }
        .phone{
          position:absolute;
          left:110px;
          top:137px;
          width:718px;
          height:1453px;
          border-radius:63px;
          background:linear-gradient(135deg,#dfe5eb 0%,#181b20 8%,#020305 14%,#07090c 85%,#2d3239 93%,#d9dee4 100%);
          box-shadow:0 18px 38px rgba(22,40,63,.21),0 3px 7px rgba(0,0,0,.18);
        }
        .phone::before{
          content:"";
          position:absolute;
          right:-6px;
          top:292px;
          width:7px;
          height:158px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .phone::after{
          content:"";
          position:absolute;
          right:-6px;
          top:512px;
          width:7px;
          height:79px;
          border-radius:0 5px 5px 0;
          background:linear-gradient(#cbd0d6,#343a41,#d5d9dd);
        }
        .screen{
          position:absolute;
          inset:15px;
          border-radius:52px;
          overflow:hidden;
          background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
          box-shadow:inset 0 0 0 1px rgba(18,32,55,.06);
        }
        .statusbar{
          height:70px;
          padding:22px 55px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          font-size:21px;
          font-weight:900;
          color:#111;
        }
        .status-icons{display:flex;align-items:center;gap:9px}
        .signal{height:18px;display:flex;align-items:flex-end;gap:2px}
        .signal i{display:block;width:4px;background:#080808;border-radius:2px}
        .signal i:nth-child(1){height:7px}
        .signal i:nth-child(2){height:11px}
        .signal i:nth-child(3){height:15px}
        .signal i:nth-child(4){height:19px}
        .wifi{width:23px;height:17px;position:relative}
        .wifi::before{content:"";position:absolute;left:1px;right:1px;top:0;height:12px;border-top:5px solid #080808;border-radius:50%}
        .wifi::after{content:"";position:absolute;left:8px;top:9px;width:7px;height:7px;border-radius:50%;background:#080808}
        .battery{width:20px;height:20px;border-radius:3px;background:#080808;position:relative}
        .battery::after{content:"";position:absolute;right:-4px;top:5px;width:3px;height:8px;background:#080808;border-radius:0 2px 2px 0}

        .header{
          height:112px;
          display:flex;
          align-items:center;
          padding:9px 45px;
        }
        .back{
          width:45px;height:45px;
          display:flex;align-items:center;justify-content:center;
          margin-right:20px;
        }
        .back::before{
          content:"";
          width:18px;height:18px;
          border-left:4px solid #10213c;
          border-bottom:4px solid #10213c;
          transform:rotate(45deg);
          margin-left:8px;
        }
        .header-title{
          font-size:36px;
          font-weight:900;
        }
        .content{
          position:absolute;
          left:46px;right:46px;
          top:168px;
          bottom:110px;
        }
        .card{
          background:#fff;
          border:1px solid #edf1f5;
          border-radius:18px;
          box-shadow:0 7px 22px rgba(33,61,96,.05);
        }
        .basic{
          height:480px;
          padding:26px 30px 20px;
        }
        .advanced{
          height:451px;
          margin-top:20px;
          padding:25px 30px 20px;
        }
        .card-title{
          font-size:29px;
          line-height:1;
          font-weight:900;
          margin-bottom:27px;
        }
        .setting-row{
          height:82px;
          display:grid;
          grid-template-columns:1fr 176px 60px;
          align-items:center;
          gap:10px;
          font-size:26px;
          color:#1c2e4c;
        }
        .setting-row.compact{
          grid-template-columns:1fr 84px;
        }
        .input-box{
          height:65px;
          border-radius:12px;
          background:#f3f6f9;
          display:flex;
          align-items:center;
          padding:0 22px;
          font-size:25px;
          color:#10213c;
          font-weight:700;
        }
        .unit{
          font-size:24px;
          color:#1f3150;
          text-align:left;
        }
        .switch{
          width:88px;
          height:49px;
          border-radius:25px;
          background:#2d7df5;
          position:relative;
          justify-self:end;
          box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);
        }
        .switch::after{
          content:"";
          position:absolute;
          width:41px;height:41px;
          top:4px;right:4px;
          border-radius:50%;
          background:#fff;
          box-shadow:0 2px 6px rgba(0,0,0,.16);
        }
        .save{
          width:100%;
          height:84px;
          margin-top:26px;
          border:0;
          border-radius:14px;
          background:linear-gradient(90deg,#ff3277,#ff4180);
          color:#fff;
          font-size:31px;
          font-weight:900;
          box-shadow:0 8px 18px rgba(255,55,119,.12);
        }

        .nav{
          position:absolute;
          left:0;right:0;bottom:0;
          height:103px;
          border-top:1px solid #e6ebf1;
          background:#fff;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          padding:10px 34px 8px;
        }
        .nav-item{
          display:flex;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          color:#6d8098;
          font-size:20px;
        }
        .nav-item.active{color:var(--pink)}
        .nav-item svg{
          width:33px;height:33px;
          stroke:currentColor;
          fill:none;
          stroke-width:2.3;
          stroke-linecap:round;
          stroke-linejoin:round;
        }
        .nav-item.active .fill{fill:currentColor;stroke:currentColor}
        .home-indicator{
          position:absolute;
          left:50%;
          bottom:7px;
          transform:translateX(-50%);
          width:198px;
          height:9px;
          border-radius:8px;
          background:#d1d5db;
        }
    </style>
</head>
<body>
<div class="canvas">
    <div class="page-title">7. 任务设置</div>

    <div class="phone">
        <div class="screen">
            <div class="statusbar">
                <div>9:41</div>
                <div class="status-icons">
                    <div class="signal"><i></i><i></i><i></i><i></i></div>
                    <div class="wifi"></div>
                    <div class="battery"></div>
                </div>
            </div>

            <div class="header">
                <div class="back"></div>
                <div class="header-title">任务设置</div>
            </div>

            <main class="content">
                <section class="card basic">
                    <div class="card-title">基础设置</div>

                    <div class="setting-row">
                        <div>操作间隔</div>
                        <div class="input-box">5-10</div>
                        <div class="unit">秒</div>
                    </div>

                    <div class="setting-row">
                        <div>错误重试</div>
                        <div class="input-box">3</div>
                        <div class="unit">次</div>
                    </div>

                    <div class="setting-row">
                        <div>账号冷却时间</div>
                        <div class="input-box">30</div>
                        <div class="unit">分钟</div>
                    </div>

                    <div class="setting-row">
                        <div>单账号每日上限</div>
                        <div class="input-box">200</div>
                        <div class="unit">人</div>
                    </div>

                    <div class="setting-row">
                        <div>同时运行任务</div>
                        <div class="input-box">1</div>
                        <div class="unit">个</div>
                    </div>
                </section>

                <section class="card advanced">
                    <div class="card-title">高级设置</div>

                    <div class="setting-row compact">
                        <div>智能识别状态 (推荐)</div>
                        <div class="switch"></div>
                    </div>

                    <div class="setting-row compact">
                        <div>自动切换账号</div>
                        <div class="switch"></div>
                    </div>

                    <div class="setting-row compact">
                        <div>失败自动重试</div>
                        <div class="switch"></div>
                    </div>

                    <div class="setting-row compact">
                        <div>任务完成通知</div>
                        <div class="switch"></div>
                    </div>

                    <div class="setting-row compact">
                        <div>详细日志记录</div>
                        <div class="switch"></div>
                    </div>
                </section>

                <button class="save">保存设置</button>
            </main>

            <nav class="nav">
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 11.3 12 4l9 7.3V21h-6v-6H9v6H3z"/></svg>
                    <span>首页</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21c.8-5 3.2-7 7.5-7s6.7 2 7.5 7"/></svg>
                    <span>账号</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-7-10a4.2 4.2 0 0 1 7-3.1A4.2 4.2 0 0 1 19 11c0 5.4-7 10-7 10Z"/><path d="m9.6 11.4 2.4 2.4 2.8-3"/></svg>
                    <span>目标UP</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="15" rx="2"/><path d="M8 5h8M9 3h6v4H9z"/><path d="m9 13 2 2 4-4"/></svg>
                    <span>任务</span>
                </div>
                <div class="nav-item active">
                    <svg viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 14.8 6L14.5 3h-5l-.3 3a7 7 0 0 0-1.7 1.1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1A7 7 0 0 0 9.2 18l.3 3h5l.3-3a7 7 0 0 0 1.7-1.1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"/></svg>
                    <span>设置</span>
                </div>
            </nav>

            <div class="home-indicator"></div>
        </div>
    </div>
</div>
</body>
</html>
